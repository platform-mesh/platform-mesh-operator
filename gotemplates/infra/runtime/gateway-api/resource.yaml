{{- if .gatewayApi.enabled }}
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  labels:
    artifact: chart
    {{- if .gatewayApi.kustomization }}
    repo: git
    {{- else }}
    repo: oci
    {{- end }}
  name: {{ .gatewayApi.name }}
  namespace: {{ .releaseNamespace }}
spec:
  componentRef:
    name: {{ .ocm.component.name }}
  ocmConfig:
    - apiVersion: delivery.ocm.software/v1alpha1
      kind: Repository
      name: {{ .ocm.repo.name }}
      namespace: {{ .releaseNamespace }}
  resource:
    byReference:
      referencePath:
      {{- range .ocm.referencePath }}
        - name: {{ .name }}
      {{- end }}
        - name: {{ .gatewayApi.name }}
      resource:
        name: {{ .gatewayApi.ocmResourceName }}
{{- end }}