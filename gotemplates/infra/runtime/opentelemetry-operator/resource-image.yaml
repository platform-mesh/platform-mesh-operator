{{- if .opentelemetryOperator.enabled }}
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  labels:
    artifact: image
    repo: oci
    for: {{ .opentelemetryOperator.name }}
  annotations:
    path: manager.image.tag
    # the chart exposes all three images as a single host-qualified repository
    # + tag (no registry/digest), so fold the registry into the repository.
    image-ref: combined
  name: {{ .opentelemetryOperator.name }}-image
  namespace: {{ .releaseNamespace }}
spec:
  componentRef:
    name: {{ .ocm.component.name }}
  ocmConfig:
    - apiVersion: delivery.ocm.software/v1alpha1
      kind: Repository
      name: {{ .ocm.repo.name }}
      namespace: {{ .releaseNamespace }}
  resource:
    byReference:
      referencePath:
      {{- range .ocm.referencePath }}
        - name: {{ .name }}
      {{- end }}
        - name: {{ .opentelemetryOperator.ocmComponentName }}
      resource:
        name: manager-image
  additionalStatusFields:
    registry: resource.access.imageReference.toOCI().registry
    repository: resource.access.imageReference.toOCI().repository
    tag: resource.access.imageReference.toOCI().tag
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  labels:
    artifact: image
    repo: oci
    for: {{ .opentelemetryOperator.name }}
  annotations:
    path: manager.collectorImage.tag
    image-ref: combined
  name: {{ .opentelemetryOperator.name }}-collector-image
  namespace: {{ .releaseNamespace }}
spec:
  componentRef:
    name: {{ .ocm.component.name }}
  ocmConfig:
    - apiVersion: delivery.ocm.software/v1alpha1
      kind: Repository
      name: {{ .ocm.repo.name }}
      namespace: {{ .releaseNamespace }}
  resource:
    byReference:
      referencePath:
      {{- range .ocm.referencePath }}
        - name: {{ .name }}
      {{- end }}
        - name: {{ .opentelemetryOperator.ocmComponentName }}
      resource:
        name: collector-image
  additionalStatusFields:
    registry: resource.access.imageReference.toOCI().registry
    repository: resource.access.imageReference.toOCI().repository
    tag: resource.access.imageReference.toOCI().tag
---
apiVersion: delivery.ocm.software/v1alpha1
kind: Resource
metadata:
  labels:
    artifact: image
    repo: oci
    for: {{ .opentelemetryOperator.name }}
  annotations:
    path: manager.targetAllocatorImage.tag
    image-ref: combined
  name: {{ .opentelemetryOperator.name }}-target-allocator-image
  namespace: {{ .releaseNamespace }}
spec:
  componentRef:
    name: {{ .ocm.component.name }}
  ocmConfig:
    - apiVersion: delivery.ocm.software/v1alpha1
      kind: Repository
      name: {{ .ocm.repo.name }}
      namespace: {{ .releaseNamespace }}
  resource:
    byReference:
      referencePath:
      {{- range .ocm.referencePath }}
        - name: {{ .name }}
      {{- end }}
        - name: {{ .opentelemetryOperator.ocmComponentName }}
      resource:
        name: target-allocator-image
  additionalStatusFields:
    registry: resource.access.imageReference.toOCI().registry
    repository: resource.access.imageReference.toOCI().repository
    tag: resource.access.imageReference.toOCI().tag
{{- end }}
