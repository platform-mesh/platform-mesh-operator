apiVersion: apis.kcp.io/v1alpha2
kind: APIBinding
metadata:
  name: core.platform-mesh.io
spec:
  permissionClaims:
  - resource: workspaces
    group: tenancy.kcp.io
    selector:
      matchAll: true
    verbs:
      - '*'
    state: Accepted
    identityHash: {{ .apiExportRootTenancyKcpIoIdentityHash }}
  - resource: workspacetypes
    group: tenancy.kcp.io
    selector:
      matchAll: true
    verbs:
      - '*'
    state: Accepted
    identityHash: {{ .apiExportRootTenancyKcpIoIdentityHash }}
  - resource: apibindings
    group: apis.kcp.io
    selector:
      matchAll: true
    verbs:
      - '*'
    state: Accepted
  - resource: apiexports
    group: apis.kcp.io
    selector:
      matchAll: true
    verbs:
      - '*'
    state: Accepted
  - resource: apiresourceschemas
    group: apis.kcp.io
    selector:
      matchAll: true
    verbs:
      - '*'
    state: Accepted
  - resource: logicalclusters
    group: core.kcp.io
    selector:
      matchAll: true
    verbs:
      - '*'
    state: Accepted
  - resource: secrets
    group: ""
    selector:
      matchExpressions:
        - key: core.platform-mesh.io/idp-name
          operator: Exists
        - key: core.platform-mesh.io/client-name
          operator: Exists
    verbs:
      - get
      - create
      - update
      - delete
    state: Accepted
  reference:
    export:
      name: core.platform-mesh.io
      path: root:platform-mesh-system
